name: Cierres 1816 - Break-Even

on:
  schedule:
    # 17:40 hora Argentina (20:40 UTC), lunes a viernes. Los feriados los saltea el script.
    - cron: "40 20 * * 1-5"
  workflow_dispatch:   # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: commits-cierres   # evita que dos workflows empujen al mismo tiempo
  cancel-in-progress: false

jobs:
  guardar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pandas openpyxl requests

      - name: Guardar cierre del día
        env:
          API_1816_KEY: ${{ secrets.API_1816_KEY }}
        run: python guardar_cierres_be.py

      - name: Commit del CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add precios_1816.csv
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Cierre 1816 BE $(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
